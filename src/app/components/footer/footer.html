<footer class="py-10 bg-slate-900 border-t border-slate-800 text-slate-300 text-sm relative overflow-hidden">
  <!-- Subtle Ambient Top Glow -->
  <div class="absolute top-0 left-1/2 -translate-x-1/2 w-96 h-28 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>
  
  <!-- Top Accent Gradient Stripe -->
  <div class="absolute top-0 inset-x-0 h-[2.5px] bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-500"></div>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center space-y-6">
    
    <!-- Centered Brand Logo & Title -->
    <div class="flex items-center justify-center gap-3">
      <div class="relative w-11 h-11 sm:w-12 sm:h-12 rounded-logo-circle p-[2px] bg-gradient-to-tr from-blue-500 via-indigo-500 to-purple-500 shadow-lg shadow-blue-500/25 shrink-0">
        <div class="w-full h-full rounded-logo-circle bg-white flex items-center justify-center overflow-hidden">
          <img 
            src="assets/Mahesh_gite_logo.png" 
            alt="Mahesh Gite Logo" 
            class="w-full h-full object-cover rounded-logo-circle"
            loading="lazy"
          />
        </div>
      </div>
      <div class="text-left">
        <h3 class="text-lg font-bold text-white tracking-tight leading-tight">Mahesh Gite</h3>
        <p class="text-xs text-blue-400 font-mono font-medium">Software Developer</p>
      </div>
    </div>

    <!-- Centered Contact Icons (Email, Phone, LinkedIn) -->
    <div class="flex items-center justify-center gap-3.5">
      <!-- Email Icon -->
      <a 
        [href]="'mailto:' + email"
        class="w-10 h-10 rounded-xl bg-slate-800/90 border border-slate-700 text-blue-400 hover:text-white hover:bg-blue-600 hover:border-blue-500 transition-all flex items-center justify-center shadow-sm hover:scale-110 hover:shadow-md"
        aria-label="Email Mahesh Gite"
        title="Send Email"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
        </svg>
      </a>

      <!-- Phone Icon -->
      <a 
        [href]="'tel:' + phone"
        class="w-10 h-10 rounded-xl bg-slate-800/90 border border-slate-700 text-emerald-400 hover:text-white hover:bg-emerald-600 hover:border-emerald-500 transition-all flex items-center justify-center shadow-sm hover:scale-110 hover:shadow-md"
        aria-label="Call Mahesh Gite"
        title="Call / WhatsApp"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
        </svg>
      </a>

      <!-- LinkedIn Icon -->
      <a 
        [href]="linkedin" 
        target="_blank" 
        rel="noopener noreferrer" 
        class="w-10 h-10 rounded-xl bg-slate-800/90 border border-slate-700 text-sky-400 hover:text-white hover:bg-sky-600 hover:border-sky-500 transition-all flex items-center justify-center shadow-sm hover:scale-110 hover:shadow-md"
        aria-label="LinkedIn profile"
        title="LinkedIn Profile"
      >
        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
          <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 10.9v8.37H9.2V10.9H6.46M7.83 6.64a1.64 1.64 0 1 0 0 3.28 1.64 1.64 0 0 0 0-3.28z"/>
        </svg>
      </a>
    </div>

    <!-- Bottom Copyright Row -->
    <div class="pt-4 border-t border-slate-800/80 text-xs text-slate-400">
      <p>© {{ currentYear }} Mahesh Gite. All rights reserved.</p>
    </div>

  </div>
</footer>
