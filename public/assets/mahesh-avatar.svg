<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="500" fill="url(#bgGrad)"/>
  
  <!-- Subtle Office Window Lines in Background -->
  <line x1="120" y1="0" x2="120" y2="500" stroke="#334155" stroke-width="1.5" opacity="0.4"/>
  <line x1="280" y1="0" x2="280" y2="500" stroke="#334155" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Shoulders & Dark Blue Suit -->
  <path d="M 50 500 L 110 330 L 160 300 L 240 300 L 290 330 L 350 500 Z" fill="url(#suitGrad)"/>
  
  <!-- Light Blue Shirt Collar -->
  <polygon points="175,300 200,360 225,300 200,285" fill="#e0f2fe"/>
  <polygon points="175,300 200,340 185,300" fill="#bae6fd"/>
  <polygon points="225,300 200,340 215,300" fill="#bae6fd"/>

  <!-- Neck -->
  <rect x="182" y="240" width="36" height="55" rx="8" fill="#d4a373"/>

  <!-- Head / Face -->
  <ellipse cx="200" cy="210" rx="46" ry="56" fill="#e0ac69"/>

  <!-- Hair Style (Black, neat side sweep) -->
  <path d="M 152 205 C 150 150, 170 140, 200 140 C 235 140, 252 155, 248 205 C 242 185, 235 175, 215 170 C 195 165, 170 175, 152 205 Z" fill="#0f172a"/>
  
  <!-- Mustache -->
  <path d="M 188 232 Q 200 230 212 232 Q 200 236 188 232 Z" fill="#0f172a"/>

  <!-- Smile -->
  <path d="M 190 238 Q 200 246 210 238" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Badge at Bottom -->
  <rect x="70" y="430" width="260" height="46" rx="12" fill="#ffffff" opacity="0.95"/>
  <text x="200" y="452" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Mahesh Gite</text>
  <text x="200" y="468" font-family="monospace" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">Frontend Developer (Angular)</text>
</svg>
